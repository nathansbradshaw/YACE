[package]
name = "yace-recognition-runtime"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
whisper-rs-sys = "=0.15.0"

[build-dependencies]
bindgen = "=0.71.1"

[profile.release]
opt-level = 3
lto = "thin"
panic = "abort"
