[package]
name = "yace-web"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT AND LGPL-2.1-or-later"

[features]
default = ["browser", "vocal-alignment"]
browser = []
vocal-alignment = []
studio = []
separation = []
browser-tests = []
lifetime-fixture = []

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies.web-sys]
version = "=0.3.104"
features = ["FileSystemCreateWritableOptions", "FileSystemDirectoryHandle", "FileSystemFileHandle", "FileSystemGetDirectoryOptions", "FileSystemGetFileOptions", "FileSystemHandle", "FileSystemWritableFileStream", "WritableStream", "FileReaderSync", "Window", "BeforeUnloadEvent", "Performance", "Document", "Element", "Node", "HtmlElement", "HtmlInputElement", "HtmlAnchorElement", "HtmlAudioElement", "HtmlMediaElement", "HtmlDialogElement", "Event", "EventTarget", "File", "FileList", "Blob", "BlobPropertyBag", "Url", "AudioContext", "AudioContextOptions", "AudioBuffer", "AudioBufferSourceNode", "AudioScheduledSourceNode", "AudioDestinationNode", "AudioNode", "AudioParam", "GainNode", "MediaElementAudioSourceNode", "Navigator", "Clipboard", "Storage", "IdbFactory", "IdbDatabase", "IdbRequest", "IdbOpenDbRequest", "IdbObjectStore", "IdbTransaction", "IdbTransactionMode", "DomException", "DomStringList", "Worker", "WorkerOptions", "WorkerType", "DedicatedWorkerGlobalScope", "MessageEvent", "ErrorEvent", "console", "Request", "RequestInit", "RequestCredentials", "RequestRedirect", "RequestCache", "ReferrerPolicy", "Headers", "Response", "AbortController", "AbortSignal", "ReadableStream", "ReadableStreamDefaultReader", "Cache", "CacheStorage"]

[dependencies]
yace-stepmania = { path = "../crates/yace-stepmania" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
midly = { version = "0.5", default-features = false, features = ["std"] }
regex = "1"
rustfft = "6.4"
pitch-detection = "0.3"
dioxus = { version = "=0.7.10", default-features = false, features = ["macro", "html", "signals", "hooks", "launch", "web", "mounted"] }
dioxus-document = { version = "=0.7.10", default-features = false }
wasm-bindgen = "=0.2.127"
wasm-bindgen-futures = "=0.4.77"
js-sys = "=0.3.104"
gloo-timers = { version = "0.3", features = ["futures"] }
zip = { version = "=9.1.3", default-features = false, features = ["deflate-flate2-zlib-rs"] }
base64 = "0.22"
console_error_panic_hook = "0.1"
futures-channel = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["std", "async-await"] }
symphonia = { version = "0.5.5", features = ["all"] }
burn = { version = "=0.20.1", default-features = false, features = ["std", "wgpu"] }
demucs-core = { path = "../vendor/demucs-core", default-features = false, features = ["wgpu"] }
getrandom = { version = "0.3", features = ["wasm_js"] }
practice-acoustic = { path = "../vendor/practice-acoustic" }
rayon = "1"
whatlang = "0.16"

[patch.crates-io]
candle-core = { path = "../vendor/candle-core" }
candle-core-legacy = { package = "candle-core", path = "../vendor/candle-core-legacy" }
symphonia-bundle-mp3 = { path = "../vendor/symphonia-bundle-mp3" }
symphonia-codec-vorbis = { path = "../vendor/symphonia-codec-vorbis" }

[profile.release]
lto = "thin"
opt-level = "s"

[dev-dependencies]
wasm-bindgen-test = "=0.3.77"

[dev-dependencies.web-sys]
version = "=0.3.104"
features = ["StorageManager", "FileSystemRemoveOptions"]
