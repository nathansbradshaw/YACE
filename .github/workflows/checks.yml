name: Checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Format, core tests and desktop build
    runs-on: macos-15
    timeout-minutes: 45
    env:
      CCACHE_DISABLE: "1"
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - name: Install native tools
        run: brew install cmake ffmpeg
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Test core without model downloads
        run: cargo test --locked --no-default-features --all-targets
      - name: Check the desktop build
        run: cargo check --locked --no-default-features --features editor --all-targets
      - name: Test the browser editor and local host
        run: cargo test --locked --no-default-features --features browser --lib --test browser_host
      - name: Lint the core
        run: cargo clippy --locked --no-default-features --all-targets -- -D warnings
      - name: Test the archive converter
        run: cargo test --locked --manifest-path tools/larsnet-convert/Cargo.toml

  static-web:
    name: Static Dioxus WebAssembly
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: 1.97.1
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - name: Check static source formatting
        run: |
          cargo fmt --manifest-path web/Cargo.toml -- --check
          cargo fmt --manifest-path web/tools/Cargo.toml -- --check
      - name: Test Rust browser codecs and static tools
        run: cargo test --locked --manifest-path web/tools/Cargo.toml
      - name: Lint static tools
        run: cargo clippy --locked --manifest-path web/tools/Cargo.toml --all-targets -- -D warnings
      - name: Lint the WebAssembly application
        run: cargo clippy --locked --manifest-path web/Cargo.toml --target wasm32-unknown-unknown -- -D warnings
      - name: Install matching browser binding generator
        run: cargo install wasm-bindgen-cli --version 0.2.127 --locked
      - name: Build deployable static files
        run: cargo run --locked --manifest-path web/tools/Cargo.toml -- build

  dependencies:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: 1.97.1
      - name: Install the advisory scanner
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Audit application and tool lockfiles
        run: |
          for lockfile in Cargo.lock tools/*/Cargo.lock web/Cargo.lock web/tools/Cargo.lock; do
            cargo audit --file "$lockfile"
          done
