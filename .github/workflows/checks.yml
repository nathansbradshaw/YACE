name: Checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Format, core tests and desktop build
    runs-on: macos-15
    timeout-minutes: 45
    env:
      CCACHE_DISABLE: "1"
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - name: Install native tools
        run: brew install cmake ffmpeg
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Test core without model downloads
        run: cargo test --locked --no-default-features --all-targets
      - name: Check the portable StepMania core
        run: |
          cargo fmt --manifest-path crates/yace-stepmania/Cargo.toml -- --check
          cargo test --locked --manifest-path crates/yace-stepmania/Cargo.toml
          cargo clippy --locked --manifest-path crates/yace-stepmania/Cargo.toml --all-targets -- -D warnings
      - name: Check the desktop build
        run: cargo check --locked --no-default-features --features editor --all-targets
      - name: Test the browser editor and local host
        run: cargo test --locked --no-default-features --features browser --lib --test browser_host
      - name: Lint the core
        run: cargo clippy --locked --no-default-features --all-targets -- -D warnings
      - name: Verify the local speech activity probe without models
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: |
          cargo fmt --manifest-path tools/vocal-speech-probe/Cargo.toml --all -- --check
          cargo test --locked --manifest-path tools/vocal-speech-probe/Cargo.toml
          cargo clippy --locked --manifest-path tools/vocal-speech-probe/Cargo.toml --all-targets -- -D warnings
      - name: Test the archive converter
        run: cargo test --locked --manifest-path tools/larsnet-convert/Cargo.toml
      - name: Verify JDC research without model downloads
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: |
          cargo fmt --manifest-path tools/vocal-jdc-probe/Cargo.toml --all -- --check
          cargo test --locked --manifest-path tools/vocal-jdc-probe/Cargo.toml
          cargo clippy --locked --manifest-path tools/vocal-jdc-probe/Cargo.toml --all-targets -- -D warnings

  performance-probe:
    name: Rust performance probe
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - name: Check the probe without native or model dependencies
        run: |
          cargo fmt --manifest-path tools/performance-probe/Cargo.toml -- --check
          cargo test --locked --manifest-path tools/performance-probe/Cargo.toml
          cargo clippy --locked --manifest-path tools/performance-probe/Cargo.toml --all-targets -- -D warnings

  pesto-probe:
    name: Rust PESTO research probe (no weights)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - name: Verify research tooling without native runtime or downloads
        run: |
          cargo fmt --manifest-path tools/vocal-pesto-probe/Cargo.toml -- --check
          cargo test --locked --manifest-path tools/vocal-pesto-probe/Cargo.toml
          cargo clippy --locked --manifest-path tools/vocal-pesto-probe/Cargo.toml --all-targets -- -D warnings

  static-web:
    name: Static Dioxus WebAssembly
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: 1.97.1
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - name: Check static source formatting
        run: |
          cargo fmt --manifest-path web/Cargo.toml -- --check
          cargo fmt --manifest-path web/tools/Cargo.toml -- --check
      - name: Install browser fixture and optimizer tools
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes ffmpeg
          cargo run --locked --manifest-path web/tools/Cargo.toml -- fetch-optimizer "$RUNNER_TEMP/binaryen.tar.gz"
          tar --extract --gzip --file "$RUNNER_TEMP/binaryen.tar.gz" --directory "$RUNNER_TEMP"
          "$RUNNER_TEMP/binaryen-version_132/bin/wasm-opt" --version
          echo "$RUNNER_TEMP/binaryen-version_132/bin" >> "$GITHUB_PATH"
      - name: Test Rust browser codecs and static tools
        run: cargo test --locked --manifest-path web/tools/Cargo.toml
      - name: Lint static tools
        run: cargo clippy --locked --manifest-path web/tools/Cargo.toml --all-targets -- -D warnings
      - name: Lint the WebAssembly application
        run: cargo clippy --locked --manifest-path web/Cargo.toml --target wasm32-unknown-unknown -- -D warnings
      - name: Install matching browser binding generator
        run: cargo install wasm-bindgen-cli --version 0.2.127 --locked
      - name: Build deployable static files
        run: cargo run --locked --manifest-path web/tools/Cargo.toml -- build

  dependencies:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: 1.97.1
      - name: Install the advisory scanner
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Audit application and tool lockfiles
        run: |
          for lockfile in Cargo.lock crates/*/Cargo.lock tools/*/Cargo.lock web/Cargo.lock web/tools/Cargo.lock; do
            cargo audit --file "$lockfile"
          done
