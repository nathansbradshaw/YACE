name: Deploy verified static YACE

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yace-pages-publication
  cancel-in-progress: false

jobs:
  deploy:
    # The environment's existing branch restriction remains authoritative.
    if: github.ref == 'refs/heads/codex/yace-public-assets'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the verified prebuilt publication branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Upload retained immutable releases
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: .
          retention-days: 1
      - name: Deploy to the existing Pages site
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        with:
          timeout: 1200000
          reporting_interval: 15000
