[package]
name = "yace-pesto-probe"
version = "0.1.0"
edition = "2024"
[workspace]

[dependencies]
anyhow = "1"
clap = {version = "4", features = ["derive"]}
serde = {version = "1", features = ["derive"]}
serde_json = "1"
sha2 = "0.10"
ort = {version = "=2.0.0-rc.10", default-features = false, features = ["std", "load-dynamic"]}
tempfile = "3"
