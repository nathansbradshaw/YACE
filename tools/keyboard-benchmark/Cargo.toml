[package]
name = "yace-keyboard-benchmark"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
chart-engine = { path = "../..", default-features = false }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
midly = "0.5"
rustysynth = "=1.3.8"
sha2 = "0.10"

[profile.release]
lto = "thin"
