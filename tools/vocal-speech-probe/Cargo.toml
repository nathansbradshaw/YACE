[package]
name = "yace-vocal-speech-probe"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
[workspace]

[dependencies]
chart-engine = {path = "../..", default-features = false}
anyhow = "1"
clap = {version = "4", features = ["derive"]}
serde_json = "1"
ort = {version = "=2.0.0-rc.10", default-features = false, features = ["std", "load-dynamic"]}

[dev-dependencies]
tempfile = "3"
