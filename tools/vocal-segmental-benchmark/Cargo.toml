[package]
name = "vocal-segmental-benchmark"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"

[dependencies]
chart-engine = { path = "../..", default-features = false }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"

[profile.release]
lto = "thin"
