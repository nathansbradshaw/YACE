[package]
name = "vocal-boundary-benchmark"
default-run = "vocal-boundary-benchmark"
version = "0.1.0"
edition = "2024"
[workspace]
[dependencies]
chart-engine = { path = "../..", default-features = false }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["std", "load-dynamic"] }
rustfft = "6.4"
